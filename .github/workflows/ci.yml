name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  # Cross-compile-only check: catches build errors per target early. No
  # artifacts are kept here -- the release workflow (goreleaser) owns
  # producing actual release binaries.
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: ppc64le
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # Regenerates the README's coverage badge on main. Uses shields.io's
  # *static* badge endpoint (label/message/color embedded directly in the
  # URL) rather than its "endpoint" JSON-fetch style -- the static form
  # renders with no callback to this repo at all, so it works the same
  # whether the repo is public or private. (The JSON-fetch style was tried
  # first and failed with "resource not found": shields.io couldn't read
  # a file from a private repo via the unauthenticated raw.githubusercontent
  # URL.) Skipped on PRs: only main's coverage should be reflected.
  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - name: Compute total coverage
        id: cov
        run: |
          go test ./... -coverprofile=coverage.out >/dev/null
          pct=$(go tool cover -func=coverage.out | grep ^total: | awk '{print $3}' | tr -d '%')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          color=red
          awk -v p="$pct" 'BEGIN { exit !(p >= 80) }' && color=brightgreen
          awk -v p="$pct" 'BEGIN { exit !(p >= 60 && p < 80) }' && color=yellow
          echo "color=$color" >> "$GITHUB_OUTPUT"
      - name: Update README badge URL
        run: |
          sed -i -E "s#(img.shields.io/badge/coverage-)[^)]*#\1${{ steps.cov.outputs.pct }}%25-${{ steps.cov.outputs.color }}#" README.md
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update coverage badge [skip ci]"
            git push
          fi

  # Builds once here so os-smoke-test (below) can run the same artifact
  # inside multiple distro containers, rather than each matrix leg needing
  # its own Go toolchain installed.
  build-smoke-test-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o slurm-why ./cmd/slurm-why
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slurm-why-linux-amd64
          path: slurm-why

  # The whole premise of shipping a CGO_ENABLED=0 static binary is that it
  # runs unmodified across the RHEL-family and SUSE distros login nodes
  # actually use, without glibc-version or missing-shared-library issues.
  # This proves that, rather than just proving the source compiles: runs
  # the real cross-compiled artifact inside each distro's own official
  # container image, exercised against real diagnosis logic using the
  # fixture-shadowing technique from CONTRIBUTING.md (no live Slurm needed).
  os-smoke-test:
    needs: build-smoke-test-binary
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rockylinux-9
            image: rockylinux@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6
            setup: dnf install -y -q tar gzip
          - name: opensuse-leap-15.6
            image: opensuse/leap@sha256:79be7751205ea84559990fb76b1bec71e38d6fad41c70a4f6c921b803b58f421
            setup: zypper --non-interactive install tar gzip
    steps:
      # actions/checkout needs tar/gzip to extract the repo archive, and
      # some minimal base images (openSUSE Leap in particular) don't ship
      # them -- install before checkout, the one step that must run before
      # any other action.
      - name: Install checkout prerequisites
        run: ${{ matrix.setup }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slurm-why-linux-amd64
      - name: Run slurm-why against fixture data (no real Slurm needed)
        run: |
          set -e
          chmod +x slurm-why
          mkdir -p fake-slurm
          cat > fake-slurm/sacct <<'EOF'
          #!/bin/sh
          cat "$GITHUB_WORKSPACE/internal/datasource/cli/testdata/sacct_oom.txt"
          EOF
          chmod +x fake-slurm/sacct
          PATH="$PWD/fake-slurm:$PATH" ./slurm-why 123 | tee output.txt
          grep -q "OOM" output.txt
