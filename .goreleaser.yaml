# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: slurm-why
    main: ./cmd/slurm-why
    binary: slurm-why
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - ppc64le
    ignore:
      - goos: darwin
        goarch: ppc64le
    ldflags:
      - -s -w
        -X github.com/ajinkyakadam/slurm-why/internal/cli.version={{.Version}}
        -X github.com/ajinkyakadam/slurm-why/internal/cli.commit={{.ShortCommit}}
        -X github.com/ajinkyakadam/slurm-why/internal/cli.date={{.Date}}

archives:
  - id: slurm-why-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# RPM for RHEL-family sysadmin installs (docs/install.md). Only applies
# to the linux binaries from the builds block above (RPM has no meaning
# for darwin) -- amd64/arm64/ppc64le all get one, since there's no
# per-arch filter on this block worth adding just to drop the least-used
# target.
nfpms:
  - id: slurm-why-rpm
    package_name: slurm-why
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - rpm
    vendor: ajinkyakadam
    homepage: https://github.com/ajinkyakadam/slurm-why
    maintainer: "Ajinkya Kadam <ajinkyakadam@users.noreply.github.com>"
    description: >-
      Plain-English diagnoses for confusing Slurm job states -- instead
      of decoding raw sacct/squeue/scontrol output yourself.
    license: MIT

# Delegates entirely to GitHub's own "generate release notes" API instead
# of a raw git-log dump -- groups by PR (title + author + link), no
# commit hashes, no manual regex-filtering of merge/bot commits needed.
# Fits this project well since every change ships through a PR already;
# see docs/releasing.md for what that means for PR titles going forward.
changelog:
  use: github-native

release:
  github:
    owner: ajinkyakadam
    name: slurm-why
